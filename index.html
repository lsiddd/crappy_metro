<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Metro Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="topBar">
                <div id="clock">
                    <div class="clock-circle"></div>
                    <div class="clock-progress"></div>
                    <div class="clock-text">W1<br>M</div>
                </div>
                <div id="resources">
                    <div class="resource-item" id="trainsResource" draggable="true">
                        <span class="resource-icon">🚂</span>
                        <span id="trainsCount">3</span>
                    </div>
                    <div class="resource-item" id="carriagesResource" style="display: none;" draggable="true">
                        <span class="resource-icon">🚃</span>
                        <span id="carriagesCount">0</span>
                    </div>
                    <div class="resource-item" id="interchangesResource" style="display: none;">
                        <span class="resource-icon">⭕</span>
                        <span id="interchangesCount">0</span>
                    </div>
                    <div class="resource-item" id="bridgesResource" style="display: none;">
                        <span class="resource-icon">🌉</span>
                        <span id="bridgesCount">2</span>
                    </div>
                </div>
                <div id="controls">
                    <button class="control-btn cheat-menu-btn" id="cheatMenuBtn" type="button" title="Cheat menu" aria-label="Open cheat menu">⚡</button>
                    <div class="control-btn" id="pauseBtn">⏸</div>
                    <div class="control-btn" id="speedBtn">▶</div>
                </div>
            </div>

            <div id="cheatIndicator" aria-live="polite"></div>

            <div id="cheatOverlay" aria-hidden="true">
                <div class="cheat-backdrop" data-close-cheats></div>
                <aside class="cheat-panel" role="dialog" aria-modal="false" aria-labelledby="cheatTitle">
                    <div class="cheat-header">
                        <div>
                            <div class="cheat-kicker">SANDBOX</div>
                            <h2 id="cheatTitle">Читы</h2>
                        </div>
                        <button class="cheat-close" type="button" data-close-cheats aria-label="Закрыть">&times;</button>
                    </div>

                    <p class="cheat-intro">Меняйте правила прямо во время игры. Прогресс и счёт сохраняются.</p>

                    <div class="cheat-section-title">Режимы</div>
                    <label class="cheat-toggle-row">
                        <span class="cheat-copy">
                            <strong>Бесконечная игра</strong>
                            <small>Переполненные станции больше не закрывают метро.</small>
                        </span>
                        <input type="checkbox" data-cheat="endlessMode">
                        <span class="cheat-switch" aria-hidden="true"></span>
                    </label>
                    <label class="cheat-toggle-row">
                        <span class="cheat-copy">
                            <strong>Заморозить календарь</strong>
                            <small>Недели стоят на месте, но поезда и пассажиры продолжают двигаться.</small>
                        </span>
                        <input type="checkbox" data-cheat="freezeCalendar">
                        <span class="cheat-switch" aria-hidden="true"></span>
                    </label>
                    <label class="cheat-toggle-row">
                        <span class="cheat-copy">
                            <strong>Турбо-поезда</strong>
                            <small>Весь парк движется вдвое быстрее.</small>
                        </span>
                        <input type="checkbox" data-cheat="turboTrains">
                        <span class="cheat-switch" aria-hidden="true"></span>
                    </label>

                    <div class="cheat-section-title">Быстрые команды</div>
                    <div class="cheat-actions">
                        <button type="button" data-cheat-action="resources">
                            <span>＋</span>
                            <strong>Пополнить запасы</strong>
                            <small>+5 поездов, вагонов и мостов</small>
                        </button>
                        <button type="button" data-cheat-action="unlockLines">
                            <span>●</span>
                            <strong>Открыть все линии</strong>
                            <small>Все линии города сразу доступны</small>
                        </button>
                        <button type="button" data-cheat-action="clearStations">
                            <span>✓</span>
                            <strong>Разгрузить станции</strong>
                            <small>Мгновенно доставить ожидающих</small>
                        </button>
                    </div>
                </aside>
            </div>

            <div id="cheatToast" role="status" aria-live="polite"></div>
            
            <div id="score">0</div>
            
            <div id="lineSelector"></div>
            
            <div id="upgradeModal">
                <div class="upgrade-container">
                    <div class="upgrade-title">Choose Upgrade</div>
                    <div class="upgrade-choices"></div>
                </div>
            </div>
            
            <div id="gameOverModal">
                <div class="gameover-container">
                    <div class="gameover-title">Metro Closed</div>
                    <div class="gameover-stats"></div>
                    <button class="restart-btn">Play Again</button>
                </div>
            </div>
            
            <div id="startScreen">
                <div class="start-container">
                    <div class="game-title">MINI METRO</div>
                    <div class="game-subtitle">Design the subway system</div>
                    <div class="city-select">
                        <div class="city-label">Select City</div>
                        <div class="city-grid">
                            <button class="city-btn selected" data-city="london">London</button>
                            <button class="city-btn" data-city="paris">Paris</button>
                            <button class="city-btn" data-city="newyork">New York</button>
                            <button class="city-btn" data-city="tokyo">Tokyo</button>
                        </div>
                    </div>
                    <button class="start-btn">START</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
